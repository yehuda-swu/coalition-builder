<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f5b">
<title>Coalition Builder</title>
<style>
:root{
  --navy:#0b2f5b;
  --blue:#2f5ea8;
  --sky:#5bb3e6;
  --red:#d1495b;
  --orange:#e67e22;
  --teal:#2a9d8f;
  --purple:#7a4fa3;
  --green:#4c956c;
  --gold:#c79a2b;
  --ink:#15314a;
  --muted:#6b7f91;
  --line:#dbe4ec;
  --panel:#ffffff;
  --wash:#f5f8fb;
  --yes:#dff4d5;
  --no:#ffd9db;
  --neutral:#dce9f7;
  --shadow:0 16px 40px rgba(20,51,80,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#eef5fb 0,#f8fbfd 34%,#ffffff 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
.app{min-height:100vh}
.shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:28px 0 72px}
.hero{background:linear-gradient(135deg,var(--navy),#123e72 64%,#176295);color:#fff;border-radius:28px;padding:34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:320px;height:320px;border:1px solid rgba(255,255,255,.15);border-radius:50%;right:-110px;top:-140px}
.eyebrow{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;font-weight:800;opacity:.8}
h1{font-size:clamp(2.1rem,6vw,4.5rem);line-height:.96;margin:10px 0 14px;letter-spacing:-.045em}
h2{font-size:clamp(1.35rem,3vw,2rem);margin:0 0 8px}
p{line-height:1.55}
.hero p{max-width:720px;font-size:1.05rem;margin:0 0 24px;color:rgba(255,255,255,.88)}
.primary,.secondary,.ghost{border:0;border-radius:14px;padding:12px 17px;font-weight:800;cursor:pointer;transition:.16s ease}
.primary{background:#fff;color:var(--navy)}
.primary:hover,.secondary:hover,.ghost:hover{transform:translateY(-1px)}
.secondary{background:var(--navy);color:#fff}
.ghost{background:#edf3f8;color:var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--navy)}
.brandMark{width:38px;height:38px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:1.1rem}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 24px rgba(20,51,80,.05)}
.metricLabel{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.metricValue{font-size:2rem;font-weight:900;margin-top:4px;color:var(--navy)}
.progressWrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:22px}
.progressHead{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}
.progress{height:14px;background:#e7eef4;border-radius:999px;overflow:hidden}
.progressFill{height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));width:0;transition:width .25s ease}
.sectorGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0 24px}
.sectorTile{border:0;border-radius:18px;padding:16px 10px;color:#fff;font-weight:900;cursor:pointer;min-height:94px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 8px 20px rgba(20,51,80,.08);transition:.15s ease}
.sectorTile:hover,.sectorTile.active{transform:translateY(-2px);outline:3px solid rgba(11,47,91,.12)}
.sectorIcon{font-size:1.55rem}.sectorName{font-size:.9rem;line-height:1.12}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:26px 0 12px}
.sectionHead p{margin:0;color:var(--muted)}
.partyGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.partyCard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 26px rgba(20,51,80,.06);display:flex;flex-direction:column;gap:14px;min-height:270px;position:relative;transition:.16s ease}
.partyCard.selected{outline:3px solid var(--blue);transform:translateY(-1px)}
.partyTop{display:flex;gap:14px;align-items:flex-start}.partyLogoWrap{width:104px;height:72px;border:1px solid var(--line);background:#fff;border-radius:14px;display:grid;place-items:center;padding:8px;flex:none}.partyLogo{max-width:100%;max-height:100%;object-fit:contain}
.leaderPhoto{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#e8eff6;color:var(--navy);font-weight:900;border:1px solid var(--line);flex:none}
.partyInfo{flex:1}.partyName{font-weight:900;font-size:1.08rem;color:var(--navy)}.leader{color:var(--muted);font-size:.9rem;margin-top:3px}.seatPill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;background:#edf3f8;font-weight:900;font-size:.82rem}
.partyFooter{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.sectorPill{font-size:.76rem;font-weight:900;border-radius:999px;padding:6px 9px;color:#fff}.selectBtn{border:0;border-radius:12px;padding:9px 11px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.partyCard.selected .selectBtn{background:#e9eff5;color:var(--ink)}
.coalitionBox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:19px;margin-top:22px}.coalitionRows{display:grid;gap:8px;margin-top:12px}.coalitionRow{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #eef2f6}.coalitionRow:last-child{border:0}.empty{color:var(--muted)}
.callout{background:#eef6ff;border:1px solid #cfe0f1;border-radius:22px;padding:22px;margin-top:22px}.callout.success{background:#eff8ea;border-color:#cfe8c2}.callout.warn{background:#fff7e8;border-color:#f1d7a4}.callout.danger{background:#fff0f0;border-color:#f0c4c7}
.policyTable{width:100%;border-collapse:separate;border-spacing:0;margin-top:14px;font-size:.87rem}.policyTable th,.policyTable td{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}.policyTable th:first-child,.policyTable td:first-child{text-align:left}.policyTable thead th{background:#eef3f7}.policyTable tr:first-child th:first-child{border-top-left-radius:12px}.policyTable tr:first-child th:last-child{border-top-right-radius:12px}.statusYes{background:var(--yes)}.statusNo{background:var(--no)}.statusNeutral{background:var(--neutral)}
.issueSummary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.issueCard{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff}.issueName{font-weight:900;font-size:.85rem}.issueCounts{font-size:.78rem;color:var(--muted);margin-top:8px}
.revealIntro{background:linear-gradient(135deg,#151a26,#29354a);color:#fff;border-radius:24px;padding:28px;margin-top:22px}.revealGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.revealCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.stance{font-weight:900;margin-top:8px}.yesTxt{color:#39793d}.noTxt{color:#b23a40}.maybeTxt{color:#94690c}.revealMetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.footerNote{font-size:.78rem;color:var(--muted);margin-top:28px;text-align:center}.hidden{display:none!important}
@media(max-width:900px){.sectorGrid{grid-template-columns:repeat(3,1fr)}.partyGrid{grid-template-columns:repeat(2,1fr)}.issueSummary{grid-template-columns:repeat(2,1fr)}.revealGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.shell{width:min(100% - 18px,1180px);padding-top:12px}.hero{padding:24px 20px;border-radius:22px}.metrics{grid-template-columns:1fr 1fr 1fr}.metric{padding:12px}.metricValue{font-size:1.5rem}.sectorGrid{grid-template-columns:repeat(2,1fr)}.partyGrid{grid-template-columns:1fr}.partyCard{min-height:0}.issueSummary,.revealGrid,.revealMetrics{grid-template-columns:1fr}.policyTable{font-size:.72rem}.policyTable th,.policyTable td{padding:7px 5px}.sectionHead{align-items:flex-start;flex-direction:column}.topbar{margin-bottom:12px}}

</style>
</head>

  return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
}
function sectorColour(name){return (sectors.find(s=>s.name===name)||sectors[0]).colour}
function selectedParties(){return parties.filter(p=>state.selected.has(p.id))}
function totalSeats(){return selectedParties().reduce((n,p)=>n+p.seats,0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(){
  if(state.stage==='welcome') return renderWelcome();
  renderGame();
}

function renderWelcome(){
  app.innerHTML=`<div class="app"><div class="shell">
    <section class="hero">
      <div class="eyebrow">Interactive Israel democracy activity</div>
      <h1>Coalition Builder</h1>
      <p>Can you form Israel's next government? Build a coalition of at least 61 seats, test the parties against five policy questions, then face one final political reality.</p>
      <button class="primary" id="start">Start the challenge</button>
    </section>
    <div class="footerNote">This prototype uses the polling scenario and policy positions supplied for the workshop.</div>
  </div></div>`;
  document.getElementById('start').addEventListener('click',()=>{state.stage='build';render()});
}

function renderGame(){
  const total=totalSeats();
  const count=state.selected.size;
  const progress=Math.min(100,(total/61)*100);
  const filtered=state.sector==='All'?parties:parties.filter(p=>p.sector===state.sector);
  app.innerHTML=`<div class="app"><div class="shell">
    <div class="topbar"><div class="brand"><div class="brandMark">61</div><div>Coalition Builder</div></div><button class="ghost" id="resetTop">Reset</button></div>
    <div class="metrics">
      <div class="metric"><div class="metricLabel">Coalition seats</div><div class="metricValue">${total}</div></div>
      <div class="metric"><div class="metricLabel">Target</div><div class="metricValue">61</div></div>
      <div class="metric"><div class="metricLabel">Parties selected</div><div class="metricValue">${count}</div></div>
    </div>
    <div class="progressWrap"><div class="progressHead"><span>Progress to a majority</span><span>${total} / 61</span></div><div class="progress"><div class="progressFill" style="width:${progress}%"></div></div></div>
    <div class="sectionHead"><div><h2>Explore the political sectors</h2><p>Filter by sector, then invite parties into your coalition.</p></div></div>
    <div class="sectorGrid">${sectors.map(s=>`<button class="sectorTile ${state.sector===s.name?'active':''}" data-sector="${esc(s.name)}" style="background:${s.colour}"><span class="sectorIcon">${s.icon}</span><span class="sectorName">${esc(s.name)}</span></button>`).join('')}</div>
    <div class="sectionHead"><div><h2>${state.sector==='All'?'All parties':esc(state.sector)}</h2><p>${filtered.length} ${filtered.length===1?'party':'parties'} in view</p></div></div>
    <div class="partyGrid">${filtered.map(p=>partyCard(p)).join('')}</div>
    ${coalitionPanel(total)}
    ${policyPanel(total)}
    ${revealPanel()}
    <div class="footerNote">Each participant can run this page independently in their own browser. No login is required.</div>
  </div></div>`;
  bindGameEvents();
}

function partyCard(p){
  const selected=state.selected.has(p.id);
  const photo=p.photo?`<img class="leaderPhoto" src="${p.photo}" alt="${esc(p.leader)}">`:`<div class="avatar">${initials(p.leader)}</div>`;
  return `<article class="partyCard ${selected?'selected':''}">
    <div class="partyTop"><div class="partyLogoWrap"><img class="partyLogo" src="${p.logo}" alt="${esc(p.name)} logo"></div>${photo}<div class="partyInfo"><div class="partyName">${esc(p.name)}</div><div class="leader">${esc(p.leader)}</div></div></div>
    <div><span class="seatPill">${p.seats} seats</span></div>
    <div class="partyFooter"><span class="sectorPill" style="background:${sectorColour(p.sector)}">${esc(p.sector)}</span><button class="selectBtn" data-party="${p.id}">${selected?'Remove':'Invite to coalition'}</button></div>
  </article>`;
}

function coalitionPanel(total){
  const chosen=selectedParties();
  const rows=chosen.length?chosen.map(p=>`<div class="coalitionRow"><span>${esc(p.name)}</span><strong>${p.seats}</strong></div>`).join(''):`<div class="empty">No parties selected yet.</div>`;
  const status=total>=61?`<div class="callout success"><h2>You have reached a majority</h2><p>Your coalition has ${total} seats. Numbers alone are not enough. Now check whether the parties agree on the major issues.</p><button class="secondary" id="checkPolicy">Check policy compatibility</button></div>`:'';
  return `<section class="coalitionBox"><h2>Your coalition</h2><div class="coalitionRows">${rows}</div></section>${status}`;
}

function policyPanel(total){
  if(state.stage!=='policy' && state.stage!=='reveal') return '';
  if(total<61) return '';
  const chosen=selectedParties();
  const issues=Object.keys(issueLabels);
  const summary=issues.map(k=>{
    const vals=chosen.map(p=>p.positions[k]);
    const yes=vals.filter(v=>v==='Yes').length,no=vals.filter(v=>v==='No').length,neutral=vals.filter(v=>v==='Neutral').length;
    return `<div class="issueCard"><div class="issueName">${issueLabels[k]}</div><div class="issueCounts">${yes} support · ${no} oppose · ${neutral} neutral</div></div>`;
  }).join('');
  const table=`<div style="overflow:auto"><table class="policyTable"><thead><tr><th>Party</th>${issues.map(k=>`<th>${issueLabels[k]}</th>`).join('')}</tr></thead><tbody>${chosen.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td>${issues.map(k=>`<td class="status${p.positions[k]}">${p.positions[k]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const next=state.stage==='policy'?`<div class="callout warn"><h2>Could these parties compromise?</h2><p>Coalition government often requires parties to live with policy differences. If you think these disagreements could be negotiated, continue to the final test.</p><button class="secondary" id="showReveal">Continue to final test</button></div>`:'';
  return `<section id="policySection" class="callout"><h2>Policy compatibility</h2><p>These are the positions supplied for the workshop. Green means support, red means opposition and blue means neutral.</p><div class="issueSummary">${summary}</div>${table}</section>${next}`;
}

function revealPanel(){
  if(state.stage!=='reveal') return '';
  const chosen=selectedParties();
  const yes=chosen.filter(p=>p.bibi==='Yes');
  const no=chosen.filter(p=>p.bibi==='No');
  const maybe=chosen.filter(p=>p.bibi==='Maybe');
  const yesSeats=yes.reduce((n,p)=>n+p.seats,0), maybeSeats=maybe.reduce((n,p)=>n+p.seats,0), noSeats=no.reduce((n,p)=>n+p.seats,0);
  const cards=chosen.map(p=>`<div class="revealCard"><strong>${esc(p.name)}</strong><div class="leader">${esc(p.leader)}</div><div class="stance ${p.bibi==='Yes'?'yesTxt':p.bibi==='No'?'noTxt':'maybeTxt'}">${p.bibi==='Yes'?'Would sit with Netanyahu':p.bibi==='No'?'Would not sit with Netanyahu':'Position uncertain or negotiable'}</div></div>`).join('');
  const verdict=yesSeats>=61?`Your coalition still contains at least 61 seats from parties marked as willing to serve under Netanyahu.`:`Your coalition does not contain 61 confirmed seats from parties marked as willing to serve under Netanyahu. The policy puzzle has become a political leadership puzzle.`;
  return `<section id="revealSection"><div class="revealIntro"><div class="eyebrow">One final factor</div><h2>Will every party sit in a Netanyahu led coalition?</h2><p>Policy agreement is not always enough. Some parties may refuse to serve under Benjamin Netanyahu even where there is substantial policy overlap.</p></div><div class="revealGrid">${cards}</div><div class="revealMetrics"><div class="metric"><div class="metricLabel">Confirmed yes</div><div class="metricValue">${yesSeats}</div></div><div class="metric"><div class="metricLabel">Maybe</div><div class="metricValue">${maybeSeats}</div></div><div class="metric"><div class="metricLabel">Refuse</div><div class="metricValue">${noSeats}</div></div></div><div class="callout danger"><h2>What happened?</h2><p>${verdict}</p><button class="secondary" id="rebuild">Rebuild the coalition</button></div></section>`;
}

function bindGameEvents(){
  document.getElementById('resetTop').addEventListener('click',resetGame);
  document.querySelectorAll('[data-sector]').forEach(b=>b.addEventListener('click',()=>{state.sector=b.dataset.sector;render()}));
  document.querySelectorAll('[data-party]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.party;
    state.selected.has(id)?state.selected.delete(id):state.selected.add(id);
    if(totalSeats()<61) state.stage='build';
    render();
  }));
  const check=document.getElementById('checkPolicy'); if(check) check.addEventListener('click',()=>{state.stage='policy';render();setTimeout(()=>document.getElementById('policySection')?.scrollIntoView({behavior:'smooth'}),50)});
  const reveal=document.getElementById('showReveal'); if(reveal) reveal.addEventListener('click',()=>{state.stage='reveal';render();setTimeout(()=>document.getElementById('revealSection')?.scrollIntoView({behavior:'smooth'}),50)});
  const rebuild=document.getElementById('rebuild'); if(rebuild) rebuild.addEventListener('click',()=>{state.stage='build';render();window.scrollTo({top:0,behavior:'smooth'})});
}

function resetGame(){state.selected.clear();state.sector='All';state.stage='build';render();window.scrollTo({top:0,behavior:'smooth'})}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service_worker.js').catch(()=>{}))}
render();

</script>
</body>
</html>
